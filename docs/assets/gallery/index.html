<html lang="zh">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4D tracks</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1b1f24; --muted:#5b6570; --line:#d8dde3; --panel:#fff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; font:13px/1.45 system-ui, sans-serif; color:var(--fg); background:var(--bg); display:flex; flex-direction:column; }
  header { display:flex; gap:12px; align-items:center; padding:8px 14px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0 6px 0 0; }
  select, button { font:inherit; padding:3px 8px; }
  #t { flex:1; min-width:160px; max-width:520px; }
  #timing { color:var(--muted); font-variant-numeric:tabular-nums; }
  main { flex:1; display:grid; grid-template-columns:minmax(0,1fr) 400px; min-height:0; }
  body.view .tuneonly { display:none; }
  body.view main { grid-template-columns:minmax(0,1fr) 340px; }
  body.noside main { grid-template-columns:minmax(0,1fr); }
  body.noside aside { display:none; }
  body:not(.view) #vPanel { display:none; }
  #view { position:relative; min-height:0; background:#fff; }
  #view.dark { background:#111316; }
  #gl { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; }
  #inset { position:absolute; left:12px; bottom:12px; width:min(300px, 32%); border:1px solid rgba(128,128,128,.5); border-radius:6px; }
  #inset[hidden] { display:none; }
  #loadbar { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:min(320px, 60%); text-align:center; color:#5b6570; font-size:12px; pointer-events:none; }
  #loadbar[hidden] { display:none; }
  #loadbar div { height:3px; background:#e3e7ec; border-radius:2px; overflow:hidden; margin-bottom:6px; }
  #loadbar i { display:block; height:100%; width:0; background:#1b1f24; transition:width .15s; }
  .viewbtns { position:absolute; top:10px; right:10px; display:flex; gap:6px; }
  .viewbtns button { background:rgba(20,22,26,.85); color:#e8ecf1; border:1px solid rgba(255,255,255,.2); border-radius:6px; }
  .viewbtns button[aria-pressed=true] { background:#3a4250; }
  aside { background:var(--panel); border-left:1px solid var(--line); overflow:auto; padding:10px 12px; }
  fieldset { border:1px solid var(--line); border-radius:6px; margin:0 0 10px; padding:6px 10px 8px; }
  legend { color:var(--muted); font-weight:600; padding:0 4px; }
  .row { display:grid; grid-template-columns:104px minmax(0,1fr) 56px; align-items:center; gap:6px; margin-top:6px; }
  .row select { min-width:0; max-width:100%; }
  aside { overflow-x:hidden; }
  .row[hidden], .checks[hidden], .help[hidden] { display:none; }
  .row label { font-weight:600; font-family:ui-monospace, monospace; font-size:12px; }
  .row output { text-align:right; font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; }
  .help { color:var(--muted); margin:2px 0 4px; font-size:12px; }
  .checks label { margin-right:12px; white-space:nowrap; }
  #counts { font-variant-numeric:tabular-nums; }
  .btns { display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; }
  .btns button.primary { background:#0b5cad; color:#fff; border:1px solid #0b5cad; border-radius:5px; padding:5px 10px; }
  .btns button { border-radius:5px; }
  #status { margin:6px 0 2px; min-height:1.4em; }
  #status.dirty { color:#a15c00; } #status.ok { color:#1a7f37; } #status.err { color:#b42318; }
  code { overflow-wrap:anywhere; font-size:11px; }
  pre { background:#f0f2f5; padding:6px; border-radius:4px; font-size:11px; white-space:pre-wrap; margin:6px 0; }

  body.embed header h1, body.embed header label, body.embed #timing, body.embed #vPanel { display:none !important; }
  body.embed header { border-bottom:0; padding:6px 10px; background:#fff; }
  body.embed main { grid-template-columns:minmax(0,1fr) !important; }
  body.embed aside { display:none !important; }
</style>

<header>
  <h1 id="title">SCALE4D</h1>
  <label>case <select id="clip"></select></label>
  <button id="play" title="Play (space)">▶</button>
  <input id="t" type="range" min="0" max="47" step="1" value="0">
  <output id="tOut">t = 0</output>
  <span id="timing"></span>
</header>
<script>if (new URLSearchParams(location.search).has("embed")) document.body.classList.add("embed");</script>
<main>
  <section id="view">
    <canvas id="gl"></canvas>
    <div class="viewbtns"><button id="vOrbit" aria-pressed="true" title="Free view (R resets)">Free view</button><button id="vInput" aria-pressed="false" title="Input camera (I)">Input camera</button><button id="vFollow" aria-pressed="false" title="Free view that moves with the input camera" hidden>Follow camera</button><button id="vTrails" aria-pressed="true">Trails</button><button id="vPanel" aria-pressed="false" title="点大小、线宽、轨迹长度、背景">显示设置</button></div>
    <img id="inset" alt="input frame">
    <div id="loadbar" hidden><div><i></i></div><span></span></div>
  </section>
  <aside>
    <fieldset class="tuneonly"><legend>1 · 动静态分割</legend>
      <div class="row"><label>method</label><select id="seg_method" style="grid-column: span 2"><option value="motion">运动阈值 + DBSCAN（viser 那套）</option><option value="sam">SAM 文字提示（做例子用）</option></select></div>
      <div id="samBox" hidden>
        <div class="row"><label>sam_prompts</label><input id="seg_sam_prompts" type="text" placeholder="person, dog" style="grid-column: span 2"></div>
        <div class="btns"><button id="samRun" class="primary">跑 SAM</button></div>
        <p class="help">用英文写要分出来的东西，多个用逗号隔开。SAM 3.1 在输入视频的每一帧上找它们；一条 track 被 query 的那个像素落在掩码里就是运动点，落在掩码边缘 2 像素内的点直接去掉。跑一次大约 2–3 分钟，结果存下来，下次打开直接用。</p>
        <div id="samStatus" class="help" style="color:var(--fg)"></div>
        <img id="samPreview" alt="" hidden style="width:100%;border-radius:4px;margin-top:4px">
      </div>
      <div id="segRows"></div>
      <div id="counts" class="help" style="color:var(--fg)"></div>
    </fieldset>
    <fieldset class="tuneonly"><legend>2 · 去飞点（另一套逻辑：去掉的点直接不画）</legend>
      <div id="dropRows"></div>
    </fieldset>
    <fieldset><legend id="displayLegend">3 · 显示</legend>
      <div id="displayRows"></div>
    </fieldset>
    <fieldset class="tuneonly"><legend>4 · 保存 / 导出</legend>
      <div class="btns">
        <button id="save" class="primary" title="把分割参数、显示设置、相机视角、当前帧存下来">保存设置</button>
        <button id="export" class="primary" title="保存，然后生成可以直接放到网站上的页面">保存并导出到网站</button>
        <button id="png" title="当前画面存成 PNG，2 倍分辨率 (P)">存 PNG</button>
      </div>
      <div class="btns"><button id="revert">恢复已保存</button><button id="defaults">恢复默认</button><button id="raw" aria-pressed="false" title="不去飞点和小碎片、不做 DBSCAN、不平滑。再点一次恢复。">去掉全部修饰</button></div>
      <div id="status"></div>
      <p class="help">「保存设置」写到 <code id="dest"></code>，下次打开这个 case 就是现在这样（参数 + 视角 + 帧）。「保存并导出到网站」另外生成 <code>publish/</code> 文件夹：纯静态文件，不带调参面板，整个文件夹拷到网站上就能用。</p>
    </fieldset>
  </aside>
</main>

      gl.vertexAttribPointer(3, 1, gl.UNSIGNED_BYTE, false, 4, base * 4 + 3);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, cnt);
      gl.disable(gl.BLEND);
    }
  }
}
function setMode(m) {
  if (m === "orbit" && mode === "input") { resetCamera(); followRef = Math.round(t); }      // go on from where the input camera is
  mode = m;
  $("vOrbit").setAttribute("aria-pressed", String(m === "orbit"));
  $("vInput").setAttribute("aria-pressed", String(m === "input"));
  refresh();
}
let drag = null;
glc.addEventListener("contextmenu", e => e.preventDefault());
glc.addEventListener("mousedown", e => { drag = { x: e.clientX, y: e.clientY, pan: e.shiftKey || e.button === 2 }; if (mode === "input") setMode("orbit"); });
window.addEventListener("mouseup", () => { drag = null; });
window.addEventListener("mousemove", e => {
  if (!drag || !cam) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  const right = V3.norm(V3.cross(cam.up, cam.off)), camUp = V3.cross(cam.off, right);
  if (drag.pan) {
    const s = cam.dist * 0.0015;
    cam.target = V3.add(cam.target, V3.add(V3.mul(right, -dx * s), V3.mul(camUp, dy * s)));
  } else {
    let off = rotate(cam.off, cam.up, -dx * 0.006);
    const next = rotate(off, V3.norm(V3.cross(cam.up, off)), -dy * 0.006);
    if (Math.abs(V3.dot(next, cam.up)) < 0.98) off = next;
    cam.off = V3.norm(off);
  }
  refresh();
});
glc.addEventListener("wheel", e => { e.preventDefault(); if (mode === "input") setMode("orbit"); cam.dist *= Math.exp(e.deltaY * 0.001); refresh(); }, { passive: false });
$("vOrbit").onclick = () => setMode("orbit");
$("vInput").onclick = () => setMode("input");
$("vFollow").onclick = () => { setFollow(!follow); if (mode !== "orbit") setMode("orbit"); else refresh(); };
$("vPanel").onclick = () => { const off = document.body.classList.toggle("noside"); $("vPanel").setAttribute("aria-pressed", String(!off)); draw(); };
$("vTrails").onclick = () => { showTrails = !showTrails; $("vTrails").setAttribute("aria-pressed", String(showTrails)); draw(); };

// ------------------------------------------------------------------ state
const gather = () => ({ seg: cfg.seg, drop: cfg.drop, display: cfg.display, view: { mode, target: cam.target, off: cam.off, dist: cam.dist, up: cam.up, fov: typeof cam.fov === "number" ? cam.fov : null, ...(follow ? { follow: true, follow_ref: followRef } : {}) }, frame: t });
function applyView(v) {
  if (v && v.target) { cam = { target: v.target, off: v.off, dist: v.dist, up: v.up, fov: v.fov === undefined ? 0.9 : v.fov }; mode = v.mode === "input" ? "input" : "orbit"; }   // views saved before had a 0.9 rad perspective
  else { resetCamera(); mode = "orbit"; }
  const moves = camMoves();
  $("vFollow").hidden = !moves;
  follow = !!(v && v.follow) && moves; followRef = v && Number.isInteger(v.follow_ref) ? v.follow_ref : Math.round(t);
  $("vFollow").setAttribute("aria-pressed", String(follow));
  $("vOrbit").setAttribute("aria-pressed", String(mode === "orbit"));
  $("vInput").setAttribute("aria-pressed", String(mode === "input"));
}
function status(text, cls) { if (VIEW) return; $("status").innerHTML = text; $("status").className = cls || ""; }
function refresh() {              // display or view changed
  syncControls(); draw();
  if (!VIEW && saved && JSON.stringify(gather()) !== saved && $("status").className !== "err") status("有未保存的修改", "dirty");
}
function showCounts() {
  if (VIEW) return;
  const c = scene.counts;
  if (cfg.seg.method === "sam") {
    $("counts").innerHTML = `显示 ${c.shown.toLocaleString()} / ${clip.tracks.toLocaleString()} 条 track（另有 ${c.dropped.toLocaleString()} 个被去掉：低置信度、飞点、小碎片、掩码边缘）· ` +
      `掩码内（运动）${c.movers.toLocaleString()} · 静态 ${c.static.toLocaleString()}` + (c.copies ? `（另有 ${c.copies.toLocaleString()} 个重复的点不画）` : "");
    $("timing").textContent = `分割 ${scene.ms.toFixed(0)} ms`;
    return;
  }
  $("counts").innerHTML = `显示 ${c.shown.toLocaleString()} / ${clip.tracks.toLocaleString()} 条 track（另有 ${c.dropped.toLocaleString()} 个低置信度的点、飞点或小碎片里的点被去掉）· 运动种子 ${c.seeds.toLocaleString()} · ` +
    `成团后运动 ${c.movers.toLocaleString()} · 静态 ${c.static.toLocaleString()}` + (c.copies ? `（另有 ${c.copies.toLocaleString()} 个重复的点不画）` : "") +
    (c.dense === undefined ? "" : `<br>逐像素点：背景 ${c.dense.toLocaleString()} · 跟着运动物体走 ${c.riders.toLocaleString()}`) + `<br>阈值 ${(scene.thresh * 100).toFixed(1)} cm` +
    `（这个 clip 的 P99 运动量 = ${(clip.motion_max * 100).toFixed(1)} cm）`;
  $("timing").textContent = `分割 ${scene.ms.toFixed(0)} ms`;
}
let pending = false;
function rebuild() {              // split parameters changed
  syncControls();
  if (pending) return;
  pending = true;
  requestAnimationFrame(() => {
    pending = false;
    scene = buildScene(clip, cfg.seg, cfg.drop);
    uploadStatic(); prepareMovers(); uploadMovers(); showCounts(); refresh();
  });
}
function setFrame(v) {
  t = Math.max(0, Math.min(clip.T - 1, v));
  $("t").value = t; $("tOut").textContent = `t = ${t}`;
  $("inset").src = frames[t].src;
  uploadMovers(); refresh();
}
$("t").addEventListener("input", () => setFrame(+$("t").value));
function tickPlay() { if (!playing) return; setFrame((t + 1) % clip.T); setTimeout(tickPlay, 125); }
$("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "❚❚" : "▶"; tickPlay(); };
window.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && e.target.type !== "range") return;
  if (e.code === "Space") { e.preventDefault(); $("play").click(); }
  if (e.key === "ArrowRight") setFrame(t + 1);
  if (e.key === "ArrowLeft") setFrame(t - 1);
  if (e.key === "r" || e.key === "R") { resetCamera(); setMode("orbit"); }
  if (e.key === "i" || e.key === "I") setMode("input");
  if ((e.key === "p" || e.key === "P") && !VIEW) $("png").click();
});
window.addEventListener("resize", () => draw());

// ------------------------------------------------------------------ save / export / PNG
function download(name, href) { const a = document.createElement("a"); a.href = href; a.download = name; a.click(); }
async function save() {
  const body = JSON.stringify(gather());
  try {
    const r = await fetch(`data/${clip.id}.config.json`, { method: "PUT", body });
    const out = await r.json();
    if (r.status === 400) { status(`保存失败：服务器不接受这些设置（${out.error}）。多半是服务器还在跑旧版代码，重启 <code>motion_seg.py serve</code> 即可。`, "err"); return false; }
    if (!r.ok) throw new Error(out.error || r.status);
    saved = body;
    const opt = $("clip").selectedOptions[0];
    if (opt && !opt.textContent.startsWith("★")) opt.textContent = "★ " + clip.id;
    status(`已保存 ✓ ${new Date().toLocaleTimeString()}<br><code>${out.saved.join("<br>")}</code>`, "ok");
    return true;
  } catch (e) {
    download(`${clip.id}.config.json`, URL.createObjectURL(new Blob([JSON.stringify(gather(), null, 1) + "\n"], { type: "application/json" })));
    status(`这个服务器不能保存（${e.message}）。设置已下载成文件：放到 <code>data/${clip.id}.config.json</code> 即可。用 <code>motion_seg.py serve</code> 起的服务才支持直接保存。`, "err");
    return false;
  }
}
async function loadSam(id) {       // data/<id>.sam.{json,bin}: the last SAM run's label of every track
  try {
    const r = await fetch(`data/${id}.sam.json`, { cache: "no-store" });
    if (!r.ok) return null;
    const info = await r.json();
    const b = await fetch(`data/${id}.sam.bin`, { cache: "no-store" });
    return b.ok ? { info, labels: new Uint8Array(await b.arrayBuffer()) } : null;
  } catch (e) { return null; }
}
function showSam() {
  const s = clip.samInfo;
  $("samPreview").hidden = !s;
  if (!s) { $("samStatus").textContent = "这个 case 还没有 SAM 结果：填提示词，点「跑 SAM」。"; return; }
  $("samPreview").src = `data/${clip.id}.sam.jpg?${encodeURIComponent(s.time)}`;
  const stale = cfg.seg.sam_prompts.split(",").map(x => x.trim()).filter(Boolean).join(", ") !== s.prompts.join(", ");
  $("samStatus").innerHTML = `现有结果（${s.time}）：` + s.prompts.map(p => `${p} ${s.tracks[p].toLocaleString()} 条 track，${s.mask_frames[p]}/${s.T} 帧有掩码`).join("；") +
    (stale ? "<br><b>提示词和这次结果不一样，要用新的提示词请再点「跑 SAM」。</b>" : "");
}
$("seg_method").addEventListener("input", () => { cfg.seg.method = $("seg_method").value; showSam(); rebuildNow(); });
$("seg_sam_prompts").addEventListener("input", () => { cfg.seg.sam_prompts = $("seg_sam_prompts").value; showSam(); refresh(); });
$("samRun").onclick = async () => {
  const id = clip.id, started = Date.now();
  $("samRun").disabled = true;
  $("samStatus").textContent = "SAM 正在跑（约 2–3 分钟，可以先看别的 case）…";
  try {
    const r = await fetch(`sam?id=${encodeURIComponent(id)}`, { method: "POST", body: JSON.stringify({ prompts: cfg.seg.sam_prompts }) });
    let out = {};
    try { out = await r.json(); } catch (e) { throw new Error("这个服务器不能跑 SAM：要用 motion_seg.py serve 起的本机页面"); }
    if (!r.ok) throw new Error(out.error || r.status);
    if (clip.id === id) {
      const s = await loadSam(id);
      clip.sam = s && s.labels; clip.samInfo = s && s.info;
      showSam(); rebuildNow();
      $("samStatus").innerHTML += `<br>刚跑完，用时 ${((Date.now() - started) / 1000).toFixed(0)} 秒。`;
    }
  } catch (e) { if (clip.id === id) $("samStatus").innerHTML = `<span style="color:#c00">SAM 失败：${e.message}</span>`; }
  $("samRun").disabled = false;
};
let rawStash = null;               // 去掉全部修饰: what the three clean-up settings were before
function setRaw(on) {
  if (on && !rawStash) {
    rawStash = { min_conf: cfg.drop.min_conf, edge_tol: cfg.drop.edge_tol, min_group: cfg.drop.min_group, cluster_min: cfg.seg.cluster_min, smooth: cfg.display.smooth, mover_density: cfg.display.mover_density };
    cfg.drop.min_conf = 0; cfg.drop.edge_tol = 0; cfg.drop.min_group = 0; cfg.seg.cluster_min = 0; cfg.display.smooth = 1; cfg.display.mover_density = 0;
  } else if (!on && rawStash) {
    cfg.drop.min_conf = rawStash.min_conf; cfg.drop.edge_tol = rawStash.edge_tol; cfg.drop.min_group = rawStash.min_group; cfg.seg.cluster_min = rawStash.cluster_min; cfg.display.smooth = rawStash.smooth; cfg.display.mover_density = rawStash.mover_density;
    rawStash = null;
  }
  $("raw").setAttribute("aria-pressed", String(!!rawStash));
  $("raw").textContent = rawStash ? "恢复修饰" : "去掉全部修饰";
}
$("raw").onclick = () => { setRaw(!rawStash); rebuildNow(); };
$("save").onclick = save;
$("export").onclick = async () => {
  if (!await save()) return;
  status("正在导出…", "");
  try {
    const r = await fetch(`export?id=${encodeURIComponent(clip.id)}`, { method: "POST" });
    const out = await r.json();
    if (!r.ok) throw new Error(out.error || r.status);
    status(`已保存并导出 ✓ ${new Date().toLocaleTimeString()}：<a href="${out.url}" target="_blank">打开导出的页面</a><br>文件夹 <code>${out.folder}</code>`, "ok");
  } catch (e) { status(`导出失败：${e.message}`, "err"); }
};
$("png").onclick = () => { draw(2); download(`${clip.id}_t${String(t).padStart(2, "0")}.png`, glc.toDataURL("image/png")); draw(1); };
$("revert").onclick = () => { rawStash = null; setRaw(false); const c = withDefaults(saved ? JSON.parse(saved) : null, clip.defaults); cfg = c; applyView(c.view); t = Math.min(c.frame, clip.T - 1); rebuildNow(); };
$("defaults").onclick = () => { rawStash = null; setRaw(false); cfg = withDefaults(null, clip.defaults); rebuildNow(); };
function rebuildNow() {
  scene = buildScene(clip, cfg.seg, cfg.drop);
  uploadStatic(); prepareMovers(); showCounts(); setFrame(t);
}

// ------------------------------------------------------------------ start
let selectSeq = 0;                // only the latest request wins when clips are picked faster than they load
async function selectClip(id) {
  const seq = ++selectSeq;
  playing = false; $("play").textContent = "▶";
  const stored = await loadConfig(id);
  if (seq !== selectSeq) return;
  if (VIEW) {
    const c = await loadBin(`${id}.scene`, `${id}.scene`);
    if (seq !== selectSeq) return;
    clip = c;
    scene = clip;
  } else {
    clip = await loadBin(id, id);
    const s = await loadSam(id), fits = s && s.labels.length === clip.n;     // labels of an earlier packing do not apply
    clip.sam = fits ? s.labels : null; clip.samInfo = fits ? s.info : null;
    rawStash = null; setRaw(false);
  }
  cfg = withDefaults(stored, clip.defaults);
  cfg.display.trail = Math.min(cfg.display.trail, clip.T - 1);
  frames = Array.from({ length: clip.T }, (_, i) => { const im = new Image(); im.src = `data/${id}/t${String(i).padStart(2, "0")}.webp${VQ}`; return im; });
  loadTexture(id, frames);
  $("t").max = clip.T - 1;
  $("display_trail").max = clip.T - 1;
  for (const k of ["dense", "dense_size", "static_tracks"]) {       // only for clips packed with their dense points
    const row = $(`display_${k}`).closest(".row, .checks"), help = row.nextElementSibling;
    row.hidden = !clip.b_r;
    if (help && help.classList.contains("help")) help.hidden = !clip.b_r;
  }
  if (!VIEW) { $("dest").textContent = `data/${id}.config.json`; showSam(); }
  location.hash = id;
  t = Math.min(cfg.frame, clip.T - 1);
  if (!VIEW) scene = buildScene(clip, cfg.seg, cfg.drop);
  applyView(cfg.view);
  uploadStatic(); prepareMovers(); showCounts();
  saved = stored ? JSON.stringify(gather()) : "";
  status(!stored ? "还没有保存过设置（现在是默认值）" : earlier(stored) ? "已载入保存的视角和显示设置。分割阈值和去飞点参数是旧版存的（按旧的运动量调的），已换成新默认值，需要的话重新调一下再保存。" : "已载入保存的设置", stored ? "ok" : "");
  baseDisplay = JSON.parse(JSON.stringify(cfg.display));
  if (styleMode !== "surface") applyStyle(styleMode);
  setFrame(t);
  if (VIEW) $("play").click();
}
// a page that embeds this one can switch the look: "surface" (the clip's saved display) or "points" (every point the
// model tracked, as round dots, the whole scene at once, as D4RT's all-pixels view), kept across clips
let styleMode = "surface", baseDisplay = null;
const POINTS = { mesh: false, frame_points: false, static_all: true, point_scale: 1.7, round_dots: true, mover_density: 0 };
function applyStyle(mode) {
  styleMode = mode;
  if (!clip || !baseDisplay) return;
  cfg.display = mode === "points" ? { ...JSON.parse(JSON.stringify(baseDisplay)), ...POINTS } : JSON.parse(JSON.stringify(baseDisplay));
  setFrame(t); refresh();
}
async function selfCheck() {      // ?check[=<JSON seg overrides>]: the lines of `motion_seg.py check SITE [--set JSON]`
  const lines = [], over = JSON.parse(new URLSearchParams(location.search).get("check") || "{}");
  for (const c of DATA.clips) {
    const C = await loadBin(c.id, c.id), cf = withDefaults(await loadConfig(c.id), C.defaults), sm = await loadSam(c.id);
    C.sam = sm && sm.labels;
    for (const [k, v] of Object.entries(over)) (k in cf.drop ? cf.drop : cf.seg)[k] = v;
    lines.push(JSON.stringify({ id: c.id, ...buildScene(C, cf.seg, cf.drop).counts }));
  }
  $("check").textContent = lines.join("\n"); $("check").hidden = false;
  document.title = "checked";
}

document.body.classList.toggle("view", VIEW);
if (VIEW) { $("title").textContent = "SCALE4D"; document.title = "SCALE4D · 4D tracks"; document.body.classList.add("noside"); $("displayLegend").textContent = "显示设置"; }
else { buildRows($("segRows"), "seg", SEG_UI); buildRows($("dropRows"), "drop", DROP_UI); }
buildRows($("displayRows"), "display", DISPLAY_UI);
initGL();
const ordered = [...DATA.clips].sort((a, b) => (b.saved ? 1 : 0) - (a.saved ? 1 : 0));      // saved clips (the examples) first
const option = c => `<option value="${c.id}">${c.saved ? "★ " : ""}${c.id}</option>`;
if (DATA.clips.some(c => c.group)) {             // a combined site: the saved clips, then one block per source
  const blocks = new Map([["★ 已保存", ordered.filter(c => c.saved)]]);
  for (const c of DATA.clips) { const g = c.group || "other"; if (!blocks.has(g)) blocks.set(g, []); blocks.get(g).push(c); }
  $("clip").innerHTML = [...blocks].filter(([, v]) => v.length).map(([g, v]) => `<optgroup label="${g} (${v.length})">${v.map(option).join("")}</optgroup>`).join("");
} else $("clip").innerHTML = ordered.map(option).join("");
$("clip").addEventListener("change", () => selectClip($("clip").value));
window.addEventListener("message", e => {
  const m = e.data;
  if (m && m.type === "scale4d-load" && DATA.clips.some(c => c.id === m.id) && (!clip || clip.id !== m.id)) {
    $("clip").value = m.id; selectClip(m.id);
  }
  if (m && m.type === "scale4d-style" && (m.style === "surface" || m.style === "points")) applyStyle(m.style);
});
if (!VIEW && new URLSearchParams(location.search).has("check")) selfCheck();
else if (DATA.clips.length) {
  const first = DATA.clips.find(c => c.id === location.hash.slice(1)) || ordered[0];
  $("clip").value = first.id;
  selectClip(first.id);
}
</script>
</html>
